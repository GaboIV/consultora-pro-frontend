server {
    listen 80;
    server_name localhost;

    # --- API: proxy interno al backend por la red de Docker ---
    # El SPA llama a /api/... (mismo origen). Aqui se reenvia al contenedor
    # 'backend' SIN exponer el backend al exterior.
    #
    # Se usa el resolver DNS de Docker (127.0.0.11) + variable en proxy_pass
    # para resolver 'backend' en CADA peticion. Esto es necesario porque en
    # cada despliegue el contenedor backend se recrea y cambia de IP; con un
    # upstream literal, Nginx cachearia la IP vieja y daria 502.
    #
    # Sin barra final tras $upstream: conserva el prefijo /api/ (el backend
    # enruta todo bajo /api/...).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream backend:8080;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
