<header class="app-nav">
  <a class="nav-logo" routerLink="/dashboard" aria-label="ConsultoraPro">
    Consultora<span>Pro</span>
  </a>

  <nav class="nav-tabs" aria-label="Secciones principales">
    @for (item of navItems; track item.path) {
      <a
        *appHasPermission="item.permission"
        class="nav-tab"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i-lucide [name]="item.icon" [size]="14" [strokeWidth]="1.8" />
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="nav-actions">
    @if (auth.currentUser$ | async; as user) {
      <div class="user-block">
        <div class="user-avatar" [attr.aria-label]="user.nombres + ' ' + user.apellidos">{{ user.iniciales }}</div>
        <div class="user-copy">
          <span>{{ user.nombres }} {{ user.apellidos }}</span>
          <small>{{ user.puesto }}</small>
        </div>
      </div>
    }
    <button class="icon-button" type="button" aria-label="Cerrar sesión" (click)="logout()">
      <i-lucide name="log-out" [size]="16" [strokeWidth]="1.9" />
    </button>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
